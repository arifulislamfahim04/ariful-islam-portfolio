    {
      "name": "about",
      "label": "Biography, skills & references",
      "type": "file",
      "path": "editor/about.json",
      "format": "json",
      "fields": [
        {
          "name": "biography",
          "label": "Biography",
          "type": "rich-text",
          "options": {
            "format": "html",
            "media": "uploads",
            "switcher": false
          }
        },
        {
          "name": "information",
          "label": "Personal information",
          "type": "object",
          "list": true,
          "fields": [
            {
              "name": "label",
              "label": "Label",
              "type": "string"
            },
            {
              "name": "value",
              "label": "Value",
              "type": "string"
            }
          ]
        },
        {
          "name": "glance",
          "label": "At a glance",
