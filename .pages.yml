{
  "media": [
    {
      "name": "uploads",
      "label": "Pictures, résumé & certificates",
      "input": "docs/assets",
      "output": "assets",
      "rename": "safe",
      "extensions": [
        "jpg",
        "jpeg",
        "png",
        "webp",
        "gif",
        "pdf",
        "mp4",
        "webm"
      ]
    },
    {
      "name": "icons",
      "label": "SVG icons (SVG Repo)",
      "input": "docs/assets/icons",
      "output": "assets/icons",
      "rename": "safe",
      "extensions": [
        "svg"
      ]
    },
    {
      "name": "institution_logos",
      "label": "Institution logos (SVG or pictures)",
      "input": "docs/assets/institutions",
      "output": "assets/institutions",
      "rename": "safe",
      "extensions": [
        "svg",
        "png",
        "jpg",
        "jpeg",
        "webp"
      ]
    },
    {
      "name": "skill_logos",
      "label": "Skill logos (SVG Repo)",
      "input": "docs/assets/skill-logos",
